name: Events Demo 1
on:
  pull_request:
    branches:
      - develop # develop branch only
    types:
      - opened
  push:
    branches:
      - main # main branch only
      - added_events # added_events branch only
      - 'dev*' # develop, develop-abc
      - 'feat/**' # feat/new-feature, feat/123, feat/abc
    paths-ignore:
      - '.github/workflows/**' # ignore docs folder
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."